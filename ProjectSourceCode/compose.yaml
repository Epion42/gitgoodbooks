services:
  db:
    image: postgres
    env_file: .env
    expose:
      - '5432'
    volumes:
      - db_data:/var/lib/postgresql

  web:
    image: node:lts
    env_file: .env
    user: 'node'
    working_dir: /home/node/app
    depends_on:
      - db
    ports:
      - '3000:3000'
    volumes:
      - ./:/home/node/app
    command: 'npm start'

volumes:
  db_data:
